name: CI

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        id: tests
        continue-on-error: true
        run: python -m pytest -v --junitxml=results.xml

      - name: Send report to local receiver
        if: always()
        env:
          REPORT_URL: ${{ secrets.REPORT_URL }}
        run: python scripts/send_report.py

      - name: Fail the stage if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4